name: Update visit counter

# 每天四次累加访问计数（0/6/12/18 点 UTC），写入仓库根目录的 counter.json。
# 网页前端只读取该文件，不需要在任何公开代码里暴露 Token。
on:
  schedule:
    # GitHub Actions 使用 UTC 时间：0,6,12,18 点 UTC = 北京时间 8,14,20,次日 2 点
    - cron: '0 */6 * * *'
  # 允许在 Actions 页面手动触发，方便随时加一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump counter.json
        run: |
          set -euo pipefail
          FILE=counter.json

          if [ ! -f "$FILE" ]; then
            echo '{"count": 0}' > "$FILE"
          fi

          CURRENT=$(python3 -c "import json;print(json.load(open('$FILE'))['count'])")
          NEXT=$((CURRENT + 1))

          python3 -c "
          import json
          json.dump({'count': $NEXT}, open('$FILE','w'), ensure_ascii=False)
          "

          echo "counter: $CURRENT -> $NEXT"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add counter.json

          # 若数字没变化则不产生空提交
          if git diff --cached --quiet; then
            echo "no change, skipping commit"
            exit 0
          fi

          git commit -m 'chore: bump visit counter'
          git push