name: diag secrets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          if [ -n "${{ secrets.PLAUSIBLE_API_KEY }}" ]; then
            echo "PLAUSIBLE_API_KEY: EXISTS (length ${#PLAUSIBLE_API_KEY})"
          else
            echo "PLAUSIBLE_API_KEY: MISSING"
          fi
          echo "all secrets: $(env | grep -c -i plausible || echo 0)"
