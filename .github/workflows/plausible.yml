name: Sync visit count from Plausible

# 从 Plausible 拉取真实累计访问数，写入 assets/visit-count.json 供页脚显示。
#
# 密钥安全设计：
#   PLAUSIBLE_API_KEY 存在 Actions secrets 里（Settings → Secrets and variables → Actions），
#   本文件与前端代码都不含密钥，公开仓库无法泄露。

on:
  schedule:
    # UTC 0,6,12,18 = 北京时间 8、14、20、次日 2 点
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 避免多次触发并发推送导致冲突
concurrency:
  group: visit-counter
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉完整历史。depth=1 时 Actions 看不到远程新提交，push 会被拒绝
          fetch-depth: 0

      - name: Fetch pageviews from Plausible
        env:
          SITE_ID: 'gangliuphys.github.io'
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${PLAUSIBLE_API_KEY}" ]; then
            echo "::error::未找到 PLAUSIBLE_API_KEY secret。"
            exit 1
          fi

          mkdir -p assets

          RESP=$(curl -sS -G "https://plausible.io/api/v1/stats/aggregate" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${PLAUSIBLE_API_KEY}" \
            --data-urlencode "site_id=${SITE_ID}" \
            --data-urlencode "period=12mo" \
            --data-urlencode "metrics=pageviews,visitors")

          echo "API 响应: ${RESP:0:300}"

          PV=$(printf '%s' "$RESP" | python3 -c "
          import json,sys
          try:
              print(int(json.load(sys.stdin)['results']['pageviews']['value']))
          except Exception as e:
              print('PARSE_FAIL: %s' % e, file=sys.stderr)
              sys.exit(1)
          ")

          UV=$(printf '%s' "$RESP" | python3 -c "
          import json,sys
          try:
              print(int(json.load(sys.stdin)['results']['visitors']['value']))
          except Exception:
              print(0)
          ")

          if [ -z "${PV}" ]; then
            echo "::error::未能解析 pageviews，跳过"
            exit 1
          fi

          # 数字为 0 说明还没有真实访客数据。此时不写文件，
          # 避免页脚显示「累计访问 0 次」，也避免 git add 找不到文件报错。
          if [ "${PV}" -eq 0 ]; then
            echo "Plausible 记录为 0 次访问（尚无真实访客），跳过写入"
            exit 0
          fi

          python3 -c "
          import json
          json.dump({'pageviews': $PV, 'visitors': $UV}, open('assets/visit-count.json','w'))
          "

          echo "pageviews = $PV, visitors = $UV"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 上一步已确保文件生成；这里仍做存在性检查，
          # 避免 git add 遇到不存在的路径时返回 exit 128
          if [ ! -f assets/visit-count.json ]; then
            echo "assets/visit-count.json 不存在，跳过提交"
            exit 0
          fi

          git add assets/visit-count.json

          if git diff --cached --quiet; then
            echo "数字未变化，无需提交"
            exit 0
          fi

          git commit -m 'chore: sync visit count'

          # 远程可能已有新提交（Pages 自动提交等），先 rebase 再推
          git pull --rebase --autostash origin main
          git push origin HEAD:main